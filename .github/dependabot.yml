version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      typescript-types:
        patterns:
          - "@types/*"
      next-ecosystem:
        patterns:
          - "next"
          - "react"
          - "react-dom"
      supabase:
        patterns:
          - "@supabase/*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
