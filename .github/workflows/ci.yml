name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rls:
    name: RLS Adversarial Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: pledgeoff_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: pledgeoff_test
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup auth schema + roles
        run: psql -f infra/tests/rls-ci-setup.sql

      - name: Apply migrations
        run: |
          for f in $(ls infra/supabase/migrations/*.sql | sort); do
            echo "Applying $f"
            psql -f "$f"
          done

      - name: Run RLS adversarial tests
        run: psql -f infra/tests/rls-adversarial.sql

  ci:
    name: Typecheck · Test · Lint · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_APP_URL: https://pledgeoff.com
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_SENTRY_DSN: ""
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          SUPABASE_DB_URL: postgresql://placeholder:placeholder@placeholder:5432/postgres
          GROQ_API_KEY: placeholder-groq-key
          GITHUB_PAT: placeholder-github-pat
          RESEND_API_KEY: placeholder-resend-key
          SENTRY_AUTH_TOKEN: placeholder-sentry-token
          CRON_SECRET: placeholder-cron-secret
          FEATURE_FETCH_REDDIT: "true"
          FEATURE_FETCH_GITHUB: "true"
          FEATURE_LLM_DECIDE: "true"
