name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Typecheck · Test · Lint · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_APP_URL: https://pledgeoff.com
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_SENTRY_DSN: ""
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          SUPABASE_DB_URL: postgresql://placeholder:placeholder@placeholder:5432/postgres
          GROQ_API_KEY: placeholder-groq-key
          GITHUB_PAT: placeholder-github-pat
          RESEND_API_KEY: placeholder-resend-key
          SENTRY_AUTH_TOKEN: placeholder-sentry-token
          CRON_SECRET: placeholder-cron-secret
          FEATURE_FETCH_REDDIT: "true"
          FEATURE_FETCH_GITHUB: "true"
          FEATURE_LLM_DECIDE: "true"
