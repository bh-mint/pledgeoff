# Prevents Supabase free-tier auto-pause (7 days no API activity) on the
# dev project, which backs both local dev and staging.pledgeoff.com. No
# other scheduled job hits this project — everything in cron.yml targets
# prod. This is a pure infra ping, not business logic.
name: Keepalive Supabase Dev

on:
  schedule:
    - cron: '0 4 */3 * *' # every 3 days at 04:00 UTC
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Supabase dev REST API
        env:
          SUPABASE_DEV_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_DEV_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          # anon key has no GRANTs on any table (by design — public access
          # goes through auth), and the REST root path requires a secret
          # key, so a real read needs service_role.
          curl -fsS --max-time 30 \
            -H "apikey: $SUPABASE_DEV_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_DEV_SERVICE_ROLE_KEY" \
            "https://vayqlprmwtvwqfxdfygl.supabase.co/rest/v1/feature_flags?select=id&limit=1"
