# Scheduled cron triggers — Vercel Hobby does not reliably execute the crons
# defined in vercel.json, so GitHub Actions calls the endpoints instead.
# Schedules mirror vercel.json 1:1 (all times UTC). The endpoints stay the
# single source of business logic; this workflow only fires authenticated GETs.
name: Cron

on:
  schedule:
    - cron: '0 2 * * *' # process-outbox
    - cron: '30 2 * * *' # update-queue
    - cron: '0 3 * * *' # cleanup + refresh-engineering
    - cron: '0 6 * * *' # past-due-billing + movement-check
    - cron: '0 8 * * 1' # weekly-digest (Mondays)
    - cron: '0 9 * * *' # email-sequences
    - cron: '0 10 * * *' # outcome-reminders
    - cron: '1 0 1 * *' # reset-otto-balance (1st of month)
    - cron: '0 9 2 * *' # accuracy-report (2nd of month)
  workflow_dispatch:
    inputs:
      endpoint:
        description: 'Cron endpoint to trigger (e.g. email-sequences)'
        required: true
        type: choice
        options:
          - process-outbox
          - update-queue
          - cleanup
          - refresh-engineering
          - past-due-billing
          - movement-check
          - weekly-digest
          - email-sequences
          - outcome-reminders
          - reset-otto-balance
          - accuracy-report

permissions: {}

concurrency:
  group: cron-${{ github.event.schedule || inputs.endpoint }}
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Call cron endpoint(s)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TARGET: ${{ github.event.schedule || inputs.endpoint }}
        run: |
          set -euo pipefail
          call() {
            echo "→ /api/v1/cron/$1"
            # .vercel.app hits Vercel directly: Cloudflare (in front of
            # pledgeoff.com) cuts requests at ~100s with a 524, so long crons
            # could never use the full maxDuration through the custom domain.
            curl -fsS --max-time 300 --retry 2 --retry-delay 30 --retry-all-errors \
              -H "Authorization: Bearer $CRON_SECRET" \
              "https://pledgeoff.vercel.app/api/v1/cron/$1"
            echo
          }
          case "$TARGET" in
            '0 2 * * *') call process-outbox ;;
            '30 2 * * *') call update-queue ;;
            '0 3 * * *') call cleanup && call refresh-engineering ;;
            '0 6 * * *') call past-due-billing && call movement-check ;;
            '0 8 * * 1') call weekly-digest ;;
            '0 9 * * *') call email-sequences ;;
            '0 10 * * *') call outcome-reminders ;;
            '1 0 1 * *') call reset-otto-balance ;;
            '0 9 2 * *') call accuracy-report ;;
            *) call "$TARGET" ;;
          esac
